before_build:
- ver
- python --version
- tryceratops --version

build_script:
- tryceratops kira_example_file.py --verbose
- tryceratops kira_example_file.py --verbose --experimental

cache:
# - "%LOCALAPPDATA%\\npm-cache"
- "%LOCALAPPDATA%\\pip\\cache"
# - "%LOCALAPPDATA%\\pipenv\\pipenv\\cache"

clone_depth: 1

environment:
  APPVEYOR_SAVE_CACHE_ON_ERROR: true

image: Visual Studio 2022

install:
- python -m pip install --upgrade pip
- pip install tryceratops

platform: x64
