before_build:
- ajv --version
- node --version
- v8r --version

build_script:
- ajv --all-errors -d .commitlintrc.yaml -s commitlintrc.json --verbose
- v8r .commitlintrc.yaml --verbose

cache:
- "%LOCALAPPDATA%\\npm-cache"
# - "%LOCALAPPDATA%\\pip\\cache"
# - "%LOCALAPPDATA%\\pipenv\\pipenv\\cache"

clone_depth: 1

environment:
  APPVEYOR_SAVE_CACHE_ON_ERROR: true

image: Visual Studio 2022

install:
- npm install --global ajv v8r

platform: x64
