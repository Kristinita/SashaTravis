build_script:
- json -e "this['1.2.0']='messages/1.2.0.txt'" -f messages.json --in-place --output json-tab
- json -e "this['1.11.0']='messages/1.11.0.txt'" -f messages.json --in-place --output json-tab
- cat messages.json

cache:
- "%LOCALAPPDATA%\\npm-cache"
# - "%LOCALAPPDATA%\\pip\\cache"
# - "%LOCALAPPDATA%\\pipenv\\pipenv\\cache"

clone_depth: 1

environment:
  APPVEYOR_SAVE_CACHE_ON_ERROR: true

image: Visual Studio 2022

install:
- choco install --yes nodejs
- npm install --global json

platform: x64
