build_script:
- "%APPVEYOR_BUILD_FOLDER%/gh-release-install.bat"
- echo "Kira Goddess!"

cache:
# - "%LOCALAPPDATA%\\npm-cache"
- "%LOCALAPPDATA%\\pip\\cache"
- "%LOCALAPPDATA%\\pipenv\\pipenv\\cache"

clone_depth: 1

environment:
  APPVEYOR_SAVE_CACHE_ON_ERROR: true

image: Visual Studio 2022

init:
- SETX PIPENV_IGNORE_VIRTUALENVS 1
- SETX PIPENV_SKIP_LOCK 1
- SETX PIPENV_VENV_IN_PROJECT 1

install:
- pip install pipenv
- pipenv install --dev

on_success:
- pipenv run fd --version
- pipenv run tidy --version

platform: x64
