build_script:
- python installation/github-release-install.py

cache:
# - "%LOCALAPPDATA%\\npm-cache"
- "%LOCALAPPDATA%\\pip\\cache"
- "%LOCALAPPDATA%\\pipenv\\pipenv\\cache"

clone_depth: 1

environment:
  APPVEYOR_SAVE_CACHE_ON_ERROR: true

image: Visual Studio 2022

install:
- pip install pipenv
- pipenv install --dev

platform: x64

test_script:
- pipenv run fd --version
- pipenv run tidy --version
