before_build:
- node --version
- v8r --version

build_script:
- v8r .htmlhintrc --verbose
- v8r .yamllint --verbose

cache:
- "%LOCALAPPDATA%\\npm-cache"
# - "%LOCALAPPDATA%\\pip\\cache"
# - "%LOCALAPPDATA%\\pipenv\\pipenv\\cache"

clone_depth: 1

environment:
  APPVEYOR_SAVE_CACHE_ON_ERROR: true

image: Visual Studio 2022

install:
- npm install --global v8r

platform: x64
