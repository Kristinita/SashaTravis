before_script:
- node --version
- npm --version
- stylus --version
- foreach --version

cache:
  directories:
  - $HOME/.npm
  # - $HOME/.cache/pip
  # - $HOME/.cache/pipenv

dist: noble

git:
  depth: 1

install:
- sudo apt install tree
- npm install --global Kristinita/foreach-cli#KiraPatchReldirWindowsPaths stylus

language: node_js

node_js: node

os: linux

script:
- 'foreach --glob "output/theme/stylus/**/*.styl" --execute "stylus #{path} --out output/theme/css/#{reldir}/#{name}.css"'
- tree output
