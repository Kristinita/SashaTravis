before_script:
- fd --version
- shellcheck --version
- fd --extension sh --format {}

cache:
  directories:
  - $HOME/.npm
# - $HOME/.cache/pip
# - $HOME/.cache/pipenv

dist: noble

git:
  depth: 1

install:
- nvm install node
- npm install --global fd-find
- sudo ln --symbolic $(which fdfind) /usr/local/bin/fd

language: shell

os: linux

script:
- fd --extension sh --format {} --exec shellcheck
