before_script:
- node --version
- v8r --version

cache:
  directories:
  - $HOME/.npm
# - $HOME/.cache/pip
# - $HOME/.cache/pipenv

dist: jammy

git:
  depth: 1

install:
- npm install --global ajv-cli v8r

language: node_js

node_js: node

os: linux

script:
- ajv --all-errors -d .commitlintrc.yaml -s commitlintrc.json --verbose
- v8r .commitlintrc.yaml --verbose
