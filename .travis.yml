before_script:
- lsb_release --all
- python --version
- bandit --version

cache:
  directories:
  # - $HOME/.npm
  - $HOME/.cache/pip
  # - $HOME/.cache/pipenv

dist: noble

git:
  depth: 1

install:
- python -m pip install --upgrade pip
- pip install bandit

language: python

os: linux

python: 3.13

script:
- bandit --configfile bandit.yaml --silent kira_valid_file.py
- bandit --ini .bandit --silent kira_valid_file.py
