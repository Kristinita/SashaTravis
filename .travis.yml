before_script:
- which git
- git --version
- git log -1 --pretty=%B

cache:
  directories:
  - $HOME/.npm
# - $HOME/.cache/pip
# - $HOME/.cache/pipenv

dist: jammy

git:
  depth: 1

install:
- npm ci --loglevel=error

language: node_js

node_js: node

os: linux

script:
- git log -1 --pretty=%B | npx commitlint --verbose
