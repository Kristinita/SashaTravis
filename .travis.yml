before_script:
- node --version
- npm --version
- imagemin --version
- foreach --version

cache:
  directories:
  - $HOME/.npm
  # - $HOME/.cache/pip
  # - $HOME/.cache/pipenv

dist: noble

git:
  depth: 1

install:
- sudo apt install tree
- npm install --global Kristinita/foreach-cli#KiraPatchReldirWindowsPaths imagemin-cli imagemin-webp

language: node_js

node_js: node

os: linux

script:
- 'foreach --glob "output/theme/images/**/*.{jpg,png}" --execute "imagemin #{path} --plugin=webp > output/theme/images/#{reldir}/#{name}.webp"'
- tree output
